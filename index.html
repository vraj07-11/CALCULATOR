<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="outerbody">
        <div class="screen"> <span id="output"> 0711 </span> </div>
        <div class="input">
        <button class="buttons left" id="AC" > AC </button>
        <button class="buttons" id="%" > % </button>
        <button class="buttons" id="backspace">  &#x232B; </button>
        <button class="buttons right" id="devide"> ÷ </button>
        <button class="buttons left" id="7"> 7 </button>
        <button class="buttons" id="8"> 8 </button>
        <button class="buttons" id="9"> 9 </button>
        <button class="buttons right" id="multiply"> &times; </button>
        <button class="buttons left" id="4"> 4 </button>
        <button class="buttons" id="5"> 5 </button>
        <button class="buttons" id="6"> 6 </button>
        <button class="buttons right" id="minus"> - </button>
        <button class="buttons left" id="1"> 1 </button>
        <button class="buttons" id="2"> 2 </button>
        <button class="buttons" id="3"> 3 </button>
        <button class="buttons right" id="plus"> + </button>
        <button class="buttons left" id="zerozero"> 00 </button>
        <button class="buttons" id="0"> 0 </button>
        <button class="buttons" id="."> . </button>
        <button class="buttons right" id="ans"> = </button>
        </div>
  
    </div>
    <script src="script.js"></script>
</body>
</html>
